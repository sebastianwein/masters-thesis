[static_params]
; Sample parameters
sample_length = 64
sampling_rate = 2048
f_lower = 4
bandpass_lower = 4
bandpass_upper = 1024
; Noise parameters
correlation_below_freq = 10
correlation_alpha = 0.4
; Waveform parameters
approximant = IMRPhenomD
; Luminosity distance to the binary (in Mpc) 
distance = 100
fade_on_alpha = 0.25
num_mergers = 2
merger_time = [0.596, 0.6]
whiten_segment_duration = 2
whiten_max_filter_duration = 2

[variable_params]
mass1 =
mass2 =
spin1z =
spin2z =
inclination =
coa_phase =
nomf_snr = 
# Antenna
right_ascension =
declination =
polarization =


[prior-mass1]
; Prior for mass1
name = uniform
min-mass1 = 10
max-mass1 = 80

[prior-mass2]
; Prior for mass2
name = uniform
min-mass2 = 10
max-mass2 = 80

[constraint-masses]
name = custom
constraint_arg = mass2 <= mass1

[prior-spin1z]  
; Prior for spin1z
name = uniform
min-spin1z = 0
max-spin1z = 0.998

[prior-spin2z]
; Prior for spin2z
name = uniform
min-spin2z = 0
max-spin2z = 0.998

[prior-inclination]
name = sin_angle

[prior-coa_phase]
; Coalescence phase prior
name = uniform_angle

[prior-nomf_snr]
; Prior for the injection SNR
name = uniform
min-nomf_snr = 5
max-nomf_snr = 15

[prior-declination+right_ascension]
; Sky position prior
name = uniform_solidangle
polar-angle = declination
azimuthal-angle = right_ascension

[prior-polarization]
; Polarization prior
name = uniform_angle